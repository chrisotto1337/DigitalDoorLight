# Voruebergehend: prueft, was der Cloudflare-Token darf. Wird danach wieder geloescht.
name: Cloudflare-Diagnose

on:
  push:
    branches: [diagnose-cloudflare]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: API-Abfragen
        run: |
          api() {
            local methode="$1" pfad="$2"
            local code
            code=$(curl -sS -o /tmp/antwort.json -w "%{http_code}" -X "$methode" \
              -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$pfad")
            echo "== $methode $pfad -> HTTP $code"
            jq -c '{success, errors: [.errors[]? | {code, message}], result: (if (.result|type)=="array" then [.result[]? | (.id // .name // .)] else (.result | if type=="object" then (with_entries(select(.key|test("status|subdomain|id|name|enabled|created_on|usage_model|compatibility_date")))) else . end) end)}' /tmp/antwort.json || cat /tmp/antwort.json
          }
          api GET "/user/tokens/verify"
          api GET "/accounts/$CF_ACCOUNT/tokens/verify"
          api GET "/accounts/$CF_ACCOUNT/workers/scripts"
          api GET "/accounts/$CF_ACCOUNT/workers/scripts/tuerampel-hub/settings"
          api GET "/accounts/$CF_ACCOUNT/workers/subdomain"
          api GET "/accounts/$CF_ACCOUNT/workers/durable_objects/namespaces"
      - name: Test-Deploy ohne Durable Object
        run: |
          mkdir -p /tmp/minimal && cd /tmp/minimal
          printf 'export default { fetch() { return new Response("Tuerampel-Hub Diagnose ohne Durable Object\\n"); } };\n' > index.js
          printf '{ "name": "tuerampel-hub", "main": "index.js", "compatibility_date": "2026-11-01", "workers_dev": true }\n' > wrangler.jsonc
          npm init -y > /dev/null && npm install --silent wrangler@4.162.0
          CLOUDFLARE_API_TOKEN="$CF_TOKEN" CLOUDFLARE_ACCOUNT_ID="$CF_ACCOUNT" npx wrangler deploy 2>&1 | grep -vE "telemetry" || true
