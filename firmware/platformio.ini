; Tuerampel: Firmware fuer das LILYGO T-Display S3 AMOLED (1,91 Zoll, Touch)
;
; Bauen:        pio run
; Aufspielen:   pio run -t upload
; Serielle Ausgabe: pio device monitor

[platformio]
default_envs = tuerampel
boards_dir = boards

[env:tuerampel]
; Plattform und Versionen wie im Hersteller-Projekt LilyGo-AMOLED-Series
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
framework = arduino
board = T-Display-AMOLED
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    esp32_exception_decoder
build_flags =
    -DBOARD_HAS_PSRAM
    -DLV_CONF_INCLUDE_SIMPLE
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -I include
lib_deps =
    lvgl/lvgl @ 9.6.0
    lewisxhe/SensorLib @ 0.5.1
    links2004/WebSockets @ 2.7.2
    bblanchon/ArduinoJson @ 7.4.3
